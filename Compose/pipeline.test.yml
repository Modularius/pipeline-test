services:
  event-formation:
    profiles:
      - event-formation
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 500m
    restart: on-failure
    logging:
      options:
        path: /home/dankirk/pipeline-test/archive/incoming/hifi_1/logs/event-formation-test.log
    image: localhost/supermusr-trace-to-events:latest
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=warn,
      - NO_COLOR=true
      - OTEL_LEVEL=none,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    command:
      - --broker=130.246.55.29:9092
      - --consumer-group=trace-to-events-test
      - --trace-topic=daq-traces-in
      - --event-topic=daq-events-test
      - --observability-address=127.0.0.1:29099
      - --otel-endpoint=http://172.16.105.83:4317/v1/traces
      - --otel-namespace=hifi_1
      - --polarity=positive
      - --baseline=0
      - differential-threshold-discriminator
      - --threshold=25
      - --duration=1
      - --cool-off=0
