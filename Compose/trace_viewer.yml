  nginx:
    restart: always
    image: docker.io/nginx:1-alpine
    ports:
      - 8089:80
    depends-on:
      - trace-viewer
    volumes:
      - ./trace-viewer-nginx.conf:/etc/nginx/conf.d/default.conf
    network_mode: "host"