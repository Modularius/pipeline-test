services:
  trace-viewer:
    deploy:
      mode: replicated
      replicas: 1
    image: ghcr.io/isisneutronmuon/digital-muon-trace-viewer:main
    #image: supermusr-trace-viewer:latest
    environment:
      - RUST_LOG=debug,digitiser_aggregator=debug,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=off,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29090:9090
    command:
      #- --broker=130.246.55.29:9092
      - --broker=172.16.113.245:19092
      - --consumer-group=viewer
      - --trace-topic=Traces
      - --digitiser-event-topic=Events
      #- --trace-topic=daq-traces-in
      #- --digitiser-event-topic=daq-events
      - --name=Test
      - --number=1
      #- --link-to-redpanda-console=http://130.246.55.29:8080/overview
      - --broker-name=Dan_Kirk_Local_Broker
      - --public-url=http://localhost:8089/trace-viewer
    network_mode: "host"
