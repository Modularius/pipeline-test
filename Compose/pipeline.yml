services:
  event-formation:
    profiles:
      - event-formation-only
      - all
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-trace-to-events:latest
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=info,trace_to_events::pulse_detection=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn
    ports:
      - 127.0.0.1:29090:9090
    command: [--broker,localhost:9092,--consumer-group,trace_to_events,--observability-address,127.0.0.1:29090,--trace-topic,daq-traces-in,--event-topic,daq-events,--polarity,positive,--baseline,0,--send-eventlist-buffer-size,1024,--otel-endpoint,http://172.16.105.83:4317/v1/traces,--otel-namespace,hifi,fixed-threshold-discriminator,--threshold,2100,--duration,1,--cool-off,0]
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  frame-aggregation:
    profiles:
      - frame-aggregation-only
      - all-but-trace-to-events
      - all
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-digitiser-aggregator:latest
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=info,trace_to_events::pulse_detection=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn
    ports:
      - 127.0.0.1:29091:9090
    command: [--broker,localhost:9092,--group,digitiser_aggregator,--observability-address,127.0.0.1:29091,--input-topic,daq-events,--output-topic,frame-events,--frame-ttl-ms,200,--send-frame-buffer-size,64,--otel-endpoint,http://172.16.105.83:4317/v1/traces,--otel-namespace,hifi,-d4,-d5,-d6,-d7,-d8,-d9,-d10,-d11]
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  nexus-writer:
    profiles:
     - nexus-writer-only
     - all-but-trace-to-events
     - all
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-nexus-writer:latest
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=info,trace_to_events::pulse_detection=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn
    ports:
      - 127.0.0.1:29092:9090
    command: [--broker,localhost:9092,--consumer-group,nexus_writer,--observability-address,127.0.0.1:29092,--control-topic,ics-control-change,--frame-event-topic,frame-events,--log-topic,Logsics-metadata,--sample-env-topic,SELogsHIFI_sampleEnv,--alarm-topic,ics-alarms,--cache-run-ttl-ms,15000,--otel-endpoint,http://172.16.105.83:4317/v1/traces,--otel-namespace,hifi,--local-path,Output/hifi,--archive-path,archive/incoming/hifi]
    volumes:
      - ../:/local
      - ../:/archive
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
