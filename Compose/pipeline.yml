services:
  event-formation:
    profiles:
      - event-formation-only
      - all
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-trace-to-events:latest
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=off,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29090:9090
    command:
      - --broker=130.246.55.29:9092
      - --consumer-group=trace-to-events-test
      - --trace-topic=daq-traces-in
      - --event-topic=daq-events
      - --observability-address=127.0.0.1:29091
      - --otel-endpoint=http://172.16.105.83:4317/v1/traces
      - --polarity=positive
      - --baseline=0
      - --otel-namespace=localtest
      - fixed-threshold-discriminator
      - --threshold=10
      - --duration=1
      - --cool-off=0
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  frame-aggregation:
    profiles:
      - frame-aggregation-only
      - all-but-trace-to-events
      - all
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-digitiser-aggregator:latest
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=off,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29091:9090
    command:
      - --broker=130.246.55.29:9092
      - --group=digitiser-aggregator-test
      - --observability-address=127.0.0.1:29092
      - --input-topic=daq-events
      - --output-topic=frame-events
      - --otel-endpoint=http://172.16.105.83:4317/v1/traces
      - --otel-namespace=localtest
      - --frame-ttl-ms=5000
      - -d4,5,6,7,8,9,10,11
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  nexus-writer:
    profiles:
     - nexus-writer-only
     - all-but-trace-to-events
     - all
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-nexus-writer:latest
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=off,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29092:9090
    command:
      - --broker=130.246.55.29:9092
      - --consumer-group=nexus-writer-test
      - --observability-address=127.0.0.1:29093
      - --frame-event-topic=frame-events
      - --control-topic=ics-control-change
      - --log-topic=ics-metadata
      - --sample-env-topic=HIFI_sampleEnv
      - --alarm-topic=ics-alarms
      - --cache-run-ttl-ms=500
      - --otel-endpoint=http://172.16.105.83:4317/v1/traces
      - --otel-namespace=localtest
      - --local-path=/local
      - --archive-path=/archive
    volumes:
      - ../Output/HiFi_test:/local
      - ../archive/incoming/hifi-via-local_test:/archive
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  event-formation-one:
    profiles:
      - event-formation-test
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-trace-to-events:latest
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=off,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29090:9090
    command:
      - --broker=130.246.55.29:9092
      - --consumer-group=trace-to-events-test-one
      - --trace-topic=daq-traces-in
      - --event-topic=daq-events-one
      - --observability-address=127.0.0.1:29091
      - --otel-endpoint=http://172.16.105.83:4317/v1/traces
      - --polarity=positive
      - --baseline=0
      - --otel-namespace=localtest-one
      - fixed-threshold-discriminator
      - --threshold=2200
      - --duration=1
      - --cool-off=0
    network_mode: "host"

  event-formation-two:
    profiles:
      - event-formation-test
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-trace-to-events:latest
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=off,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29090:9090
    command:
      - --broker=130.246.55.29:9092
      - --consumer-group=trace-to-events-test-two
      - --trace-topic=daq-traces-in
      - --event-topic=daq-events-two
      - --observability-address=127.0.0.1:29092
      - --otel-endpoint=http://172.16.105.83:4317/v1/traces
      - --polarity=positive
      - --baseline=0
      - --otel-namespace=localtest-two
      - differential-threshold-discriminator
      - --threshold=5
      - --duration=1
      - --cool-off=0
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"