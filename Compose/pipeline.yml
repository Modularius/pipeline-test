services:
  event-formation:
    profiles:
      - event-formation
      - all
    deploy:
      mode: replicated
      replicas: 1
    #logging:
    #  options:
    #    path: /home/dankirk/pipeline-test/archive/incoming/local_1/logs/event-formation.log
    image: supermusr-trace-to-events:latest
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=debug,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn,digitiser_aggregator=info,nexus_writer=info,simulator=info
    ports:
      - :9090
    command: [--broker,localhost:19092,--consumer-group,trace_to_events-1,--observability-address,127.0.0.1:29011,--trace-topic,Traces,--event-topic,Events_1,--polarity,positive,--baseline,0,--send-eventlist-buffer-size,1024,--otel-endpoint,http://172.16.105.83:4317,--otel-namespace,local_1,fixed-threshold-discriminator,--threshold,1500,--duration,1,--cool-off,0]
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  frame-aggregation:
    profiles:
      - frame-aggregation
      - all
    deploy:
      mode: replicated
      replicas: 1
    #logging:
    #  options:
    #    path: /home/dankirk/pipeline-test/archive/incoming/local_1/logs/frame-aggregation.log
    image: supermusr-digitiser-aggregator:latest
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=debug,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn,digitiser_aggregator=info,nexus_writer=info,simulator=info
    ports:
      - :9090
    command: [--broker,localhost:19092,--group,digitiser_aggregator-1,--observability-address,127.0.0.1:29021,--input-topic,Events_1,--output-topic,FrameEvents_1,--frame-ttl-ms,3500,--send-frame-buffer-size,64,--otel-endpoint,http://172.16.105.83:4317,--otel-namespace,local_1,-d0,-d1,-d2,-d3,-d4,-d5,-d6,-d7]
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  nexus-writer:
    profiles:
     - nexus-writer
     - all
    deploy:
      mode: replicated
      replicas: 1
    #logging:
    #  options:
    #    path: /home/ubuntu/SuperMuSRDataPipeline/pipeline-test/archive/incoming/local_1/logs/nexus-writer.log
    image: supermusr-nexus-writer:latest
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=debug,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn,digitiser_aggregator=info,nexus_writer=info,simulator=info
    ports:
      - :9090
    command: [--broker,localhost:19092,--consumer-group,nexus_writer-1,--observability-address,127.0.0.1:29031,--control-topic,Controls,--frame-event-topic,FrameEvents_1,--log-topic,Logs,--sample-env-topic,SELogs,--alarm-topic,Alarms,--configuration-options,{"pipeline_name":"local_1","address":"localhost:19092","topics":{"trace":"Traces","dat_event":"Events_1","frame_event":"FrameEvents_1","control":"Controls","logs":"Logs","selogs":"SELogs","alarms":"Alarms"},"consumer_groups":{"trace_to_events":"trace_to_events-1","digitiser_aggregator":"digitiser_aggregator-1","nexus_writer":"nexus_writer-1","diagnostics":"diagnostics"},"trace_to_events":{"polarity":"positive","baseline":0,"send_eventlist_buffer_size":1024},"digitiser_aggregator":{"digitiser_ids":[0,1,2,3,4,5,6,7],"frame_ttl_ms":3500,"send_frame_buffer_size":64},"nexus_writer":{"paths":{"nexus_output":"Output/local_1","nexus_archive":""},"run_ttl_ms":9000},"detector":["fixed-threshold-discriminator","--threshold","1500","--duration","1","--cool-off","0"]},--cache-run-ttl-ms,9000,--otel-endpoint,http://172.16.105.83:4317,--otel-namespace,local_1,--local-path,/local]
    volumes:
      - ../Output/local_1:/local
      - ../archive/incoming/local_1:/archive
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  event-formation-one:
    profiles:
      - event-formation-test
    deploy:
      mode: replicated
      replicas: 1
    image: 
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=debug,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn,digitiser_aggregator=info,nexus_writer=info,simulator=info
    ports:
      - :9090
    command:
      - --broker=
      - --consumer-group=-one
      - --trace-topic=
      - --event-topic=-one
      - --observability-address=127.0.0.1:29091
      - --otel-endpoint=
      - --polarity=
      - --baseline=
      - --otel-namespace=-one
      - fixed-threshold-discriminator
      - --threshold=2200
      - --duration=1
      - --cool-off=0
    network_mode: "host"

  event-formation-two:
    profiles:
      - event-formation-test
    deploy:
      mode: replicated
      replicas: 1
    image: 
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=debug,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn,digitiser_aggregator=info,nexus_writer=info,simulator=info
    ports:
      - :9090
    command:
      - --broker=
      - --consumer-group=-two
      - --trace-topic=
      - --event-topic=-two
      - --observability-address=127.0.0.1:29092
      - --otel-endpoint=
      - --polarity=
      - --baseline=
      - --otel-namespace=-two
      - differential-threshold-discriminator
      - --threshold=5
      - --duration=1
      - --cool-off=0
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"