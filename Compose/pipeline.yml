    command: [--broker,130.246.55.29:9092,--consumer-group,local_nexus_writer,--observability-address,127.0.0.1:29092,--control-topic,ics-control-change,--frame-event-topic,local-frame-events,--log-topic,ics-metadata,--sample-env-topic,SELogsHIFI_sampleEnv,--alarm-topic,ics-alarms,--configuration-options,{"pipeline_name":"hifi-via-local","address":"130.246.55.29:9092","topics":{"trace":"daq-traces-in","dat_event":"local-daq-events","frame_event":"local-frame-events","control":"ics-control-change","logs":"ics-metadata","selogs":"SELogsHIFI_sampleEnv","alarms":"ics-alarms"},"consumer_groups":{"trace_to_events":"local_trace_to_events","digitiser_aggregator":"local_digitiser_aggregator","nexus_writer":"local_nexus_writer","diagnostics":"local_diagnostics"},"trace_to_events":{"polarity":"positive","baseline":0,"send_eventlist_buffer_size":1024},"digitiser_aggregator":{"digitiser_ids":[4,5,6,7,8,9,10,11],"frame_ttl_ms":3500,"send_frame_buffer_size":64},"nexus_writer":{"paths":{"nexus_output":"Output/hifi-via-local","nexus_archive":"archive/incoming/hifi-via-local"},"run_ttl_ms":9000},"detector":["differential-threshold-discriminator","--begin-threshold","5","--end-threshold","0","--begin-duration","2","--end-duration","0","--cool-off","0","--peak-height-mode","value-at-end-trigger","--peak-height-basis","trace-baseline"]},--cache-run-ttl-ms,9000,--otel-endpoint,http://172.16.105.83:4317/v1/traces,--otel-namespace,hifi-via-local,--local-path,Output/hifi-via-local,--archive-path,archive/incoming/hifi-via-local]
    volumes:
      - ../:/local
      - ../:/archive
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  event-formation-one:
    profiles:
      - event-formation-test
    deploy:
      mode: replicated
      replicas: 1
    image: 
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=info,trace_to_events::pulse_detection=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn
    ports:
