services:
  event-formation:
    profiles:
      - event-formation-only
      - all
    deploy:
      mode: replicated
      replicas: 1
    image: ghcr.io/stfc-icd-research-and-design/supermusr-trace-to-events:main
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29090:9090
    command:
      - --broker=host.docker.internal:9092
      - --consumer-group=trace-to-events-test
      - --trace-topic=Traces
      - --event-topic=Events
      - --observability-address=127.0.0.1:9090
      - --otel-endpoint=http://host.docker.internal:4317/v1/traces
      - --polarity=positive
      - --baseline=0
      - --otel-namespace=localtest
      - fixed-threshold-discriminator
      - --threshold=10
      - --duration=1
      - --cool-off=0
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frame-aggregation:
    profiles:
      - frame-aggregation-only
      - all
    deploy:
      mode: replicated
      replicas: 1
    image: ghcr.io/stfc-icd-research-and-design/supermusr-digitiser-aggregator:main
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29091:9090
    command:
      - --broker=host.docker.internal:9092
      - --group=digitiser-aggregator-test
      - --observability-address=127.0.0.1:9090
      - --input-topic=Events
      - --output-topic=FrameEvents
      - --otel-endpoint=http://host.docker.internal:4317/v1/traces
      - --otel-namespace=localtest
      - --frame-ttl-ms=3500
      - -d0,1,2,3,4,5,6,7
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nexus-writer:
    profiles:
     - nexus-writer-only
     - all
    deploy:
      mode: replicated
      replicas: 1
    image: supermusr-nexus-writer:latest
    environment:
      - RUST_LOG=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,simulator=info,digitiser_aggregator=info,nexus_writer=info,trace_to_events=info,trace_to_events::channels=warn,trace_to_events::pulse_detection=warn
    ports:
      - 127.0.0.1:29092:9090
    command:
      - --broker=host.docker.internal:9092
      - --consumer-group=nexus-writer-test
      - --observability-address=127.0.0.1:9090
      - --frame-event-topic=FrameEvents
      - --control-topic=Controls
      - --log-topic=Controls
      - --sample-env-topic=Controls
      - --alarm-topic=Controls
      - --cache-run-ttl-ms=9000
      - --otel-endpoint=http://host.docker.internal:4317/v1/traces
      - --otel-namespace=localtest
      - --file-name=local
      - --archive-name=archive
    volumes:
      - ../Output/local_test:/local
      - ../archive/incoming/local_test:/archive
    extra_hosts:
      - "host.docker.internal:host-gateway"