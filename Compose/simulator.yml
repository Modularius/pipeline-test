services:
  simulator:
    deploy:
      mode: replicated
      replicas: 1
    network_mode: "host"
    image: 
    environment:
      - RUST_LOG=info,trace_to_events=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - MAX_DIGITISER=
      - NUM_DIGITISERS=2
      - RUN_NAME=Smoothing_Run
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=info,trace_to_events::pulse_detection=info,digitiser_aggregator=info,nexus_writer=info,simulator=warn
    command:
     - --broker=
     - --otel-namespace=
     - --otel-endpoint=
     - defined
     - "/home/"
     - --digitiser-trace-topic=
     - --digitiser-event-topic=
     - --frame-event-topic=
     - --control-topic=
     - --runlog-topic=
     - --selog-topic=
     - --alarm-topic=
    volumes:
      - ../:/home
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"