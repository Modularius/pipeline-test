services:
  event-formation:
    #logging:
    #  options:
    #    path: /home/dankirk/pipeline-test//logs/event-formation.log
    image: supermusr-trace-to-events:latest
    environment:
      - RUST_LOG=debug,trace_to_events=debug,digitiser_aggregator=info,nexus_writer=info,simulator=debug,trace_writer=debug,trace_reader=debug,tonic=off,h2=off,tokio_util=off,tower=off,hyper=off
      - NO_COLOR=true
      - OTEL_LEVEL=info,trace_to_events=info,trace_to_events::channels=info,trace_to_events::pulse_detection=info,digitiser_aggregator=info,nexus_writer=info,simulator=off,trace_writer=off,trace_reader=warn
    ports:
      - :9090
    command: [--broker,localhost:19092,--consumer-group,trace_to_events_8,--observability-address,127.0.0.1:29098,--trace-topic,Traces,--event-topic,Events_8,--polarity,positive,--baseline,0,--send-eventlist-buffer-size,1024,--otel-namespace,local_8,--otel-endpoint,http://172.16.105.83:4317,smoothing-detector,--noise-centile,90,--kernel-sigma,2,--nsig-noise,7,--min-size,5]
    network_mode: "host"

