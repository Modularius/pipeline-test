services:
  event-formation:
    profiles:
      - event-formation-only
      - all
    deploy:
      mode: replicated
      replicas: 1
    logging:
      options:
        path: /home/dankirk/pipeline-test/${NEXUS_ARCHIVE_PATH}/logs/event-formation.log
    image: $IMAGE_EVENT_FORMATION
    environment:
      - RUST_LOG=${RUST_LOG}
      - NO_COLOR=${NO_COLOR}
      - OTEL_LEVEL=${OTEL_LEVEL}
    ports:
      - ${OBSV_ADDRESS_EVENT_FORMATION}:9090
    command: ${EVENT_FORMATION_ARGS}
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  frame-aggregation:
    profiles:
      - frame-aggregation-only
      - all-but-trace-to-events
      - all
    deploy:
      mode: replicated
      replicas: 1
    logging:
      options:
        path: /home/dankirk/pipeline-test/${NEXUS_ARCHIVE_PATH}/logs/frame-aggregation.log
    image: $IMAGE_AGGREGATOR
    environment:
      - RUST_LOG=${RUST_LOG}
      - NO_COLOR=${NO_COLOR}
      - OTEL_LEVEL=${OTEL_LEVEL}
    ports:
      - ${OBSV_ADDRESS_AGGREGATOR}:9090
    command: $AGGREGATOR_ARGS
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  nexus-writer:
    profiles:
     - nexus-writer-only
     - all-but-trace-to-events
     - all
    deploy:
      mode: replicated
      replicas: 1
    logging:
      options:
        path: /home/dankirk/pipeline-test/${NEXUS_ARCHIVE_PATH}/logs/nexus-writer.log
    image: $IMAGE_WRITER
    environment:
      - RUST_LOG=${RUST_LOG}
      - NO_COLOR=${NO_COLOR}
      - OTEL_LEVEL=${OTEL_LEVEL}
    ports:
      - ${OBSV_ADDRESS_WRITER}:9090
    command: $WRITER_ARGS
    volumes:
      - ../${NEXUS_OUTPUT_PATH}:/local
      - ../${NEXUS_ARCHIVE_PATH}:/archive
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  event-formation-one:
    profiles:
      - event-formation-test
    deploy:
      mode: replicated
      replicas: 1
    image: $g_IMAGE_EVENT_FORMATION
    environment:
      - RUST_LOG=${RUST_LOG}
      - NO_COLOR=${NO_COLOR}
      - OTEL_LEVEL=${OTEL_LEVEL}
    ports:
      - ${OBSV_ADDRESS_EVENT_FORMATION}:9090
    command:
      - --broker=${BROKER}
      - --consumer-group=${GROUP_EVENT_FORMATION}-one
      - --trace-topic=${TRACE_TOPIC}
      - --event-topic=${DAT_EVENT_TOPIC}-one
      - --observability-address=127.0.0.1:29091
      - --otel-endpoint=${OTEL_ENDPOINT}
      - --polarity=${TTE_POLARITY}
      - --baseline=${TTE_BASELINE}
      - --otel-namespace=${PIPELINE_NAME}-one
      - fixed-threshold-discriminator
      - --threshold=2200
      - --duration=1
      - --cool-off=0
    network_mode: "host"

  event-formation-two:
    profiles:
      - event-formation-test
    deploy:
      mode: replicated
      replicas: 1
    image: $g_IMAGE_EVENT_FORMATION
    environment:
      - RUST_LOG=${RUST_LOG}
      - NO_COLOR=${NO_COLOR}
      - OTEL_LEVEL=${OTEL_LEVEL}
    ports:
      - ${OBSV_ADDRESS_EVENT_FORMATION}:9090
    command:
      - --broker=${BROKER}
      - --consumer-group=${GROUP_EVENT_FORMATION}-two
      - --trace-topic=${TRACE_TOPIC}
      - --event-topic=${DAT_EVENT_TOPIC}-two
      - --observability-address=127.0.0.1:29092
      - --otel-endpoint=${OTEL_ENDPOINT}
      - --polarity=${TTE_POLARITY}
      - --baseline=${TTE_BASELINE}
      - --otel-namespace=${PIPELINE_NAME}-two
      - differential-threshold-discriminator
      - --threshold=5
      - --duration=1
      - --cool-off=0
    network_mode: "host"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"