services:
  event-formation:
    profiles:
      - event-formation-only
      - all
    deploy:
      mode: replicated
      replicas: 1
    image: $g_IMAGE_EVENT_FORMATION
    environment:
      - RUST_LOG=${RUST_LOG}
      - NO_COLOR=${NO_COLOR}
      - OTEL_LEVEL=${OTEL_LEVEL}
    ports:
      - ${OBSV_ADDRESS_EVENT_FORMATION}:9090
    command:
      - --broker=${BROKER}
      - --consumer-group=${GROUP_EVENT_FORMATION}
      - --trace-topic=${TRACE_TOPIC}
      - --event-topic=${DAT_EVENT_TOPIC}
      - --observability-address=127.0.0.1:9090
      - --otel-endpoint=${OTEL_ENDPOINT}
      - --polarity=${TTE_POLARITY}
      - --baseline=${TTE_BASELINE}
      - --otel-namespace=${PIPELINE_NAME}
      - ${TTE_INPUT_MODE}
      - --threshold=${TTE_FTD_THRESHOLD}
      - --duration=${TTE_FTD_DURATION}
      - --cool-off=${TTE_FTD_COOLOFF}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frame-aggregation:
    profiles:
      - frame-aggregation-only
      - all
    deploy:
      mode: replicated
      replicas: 1
    image: $g_IMAGE_AGGREGATOR
    environment:
      - RUST_LOG=${RUST_LOG}
      - NO_COLOR=${NO_COLOR}
      - OTEL_LEVEL=${OTEL_LEVEL}
    ports:
      - ${OBSV_ADDRESS_AGGREGATOR}:9090
    command:
      - --broker=${BROKER}
      - --group=${GROUP_AGGREGATOR}
      - --observability-address=127.0.0.1:9090
      - --input-topic=${DAT_EVENT_TOPIC}
      - --output-topic=${FRAME_EVENT_TOPIC}
      - --otel-endpoint=${OTEL_ENDPOINT}
      - --otel-namespace=${PIPELINE_NAME}
      - --frame-ttl-ms=${FRAME_TTL_MS}
      - ${DIGITISERS}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nexus-writer:
    profiles:
     - nexus-writer-only
     - all
    deploy:
      mode: replicated
      replicas: 1
    image: $g_IMAGE_WRITER
    environment:
      - RUST_LOG=${g_RUST_LOG}
      - NO_COLOR=${NO_COLOR}
      - OTEL_LEVEL=${OTEL_LEVEL}
    ports:
      - ${OBSV_ADDRESS_WRITER}:9090
    command:
      - --broker=${BROKER}
      - --consumer-group=${GROUP_WRITER}
      - --observability-address=127.0.0.1:9090
      - --frame-event-topic=${FRAME_EVENT_TOPIC}
      - --control-topic=${CONTROL_TOPIC}
      - --log-topic=${LOGS_TOPIC}
      - --sample-env-topic=${SELOGS_TOPIC}
      - --alarm-topic=${ALARMS_TOPIC}
      - --cache-run-ttl-ms=${RUN_TTL_MS}
      - --otel-endpoint=${OTEL_ENDPOINT}
      - --otel-namespace=${PIPELINE_NAME}
      - --file-name=local
      - --archive-name=archive
    volumes:
      - ../${NEXUS_OUTPUT_PATH}:/local
      - ../${NEXUS_ARCHIVE_PATH}:/archive
    extra_hosts:
      - "host.docker.internal:host-gateway"